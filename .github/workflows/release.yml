name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No secrets
        run: ./scripts/check_secrets.sh
      - name: Test
        run: swift test
      - name: Bundle
        run: ./scripts/bundle.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/Jarvis-*.zip --title "${GITHUB_REF_NAME}" --generate-notes
